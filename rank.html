<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MGR Multiverse Awards — Competitor Level Rankings</title>
<style>
  :root{
    --bg1:#0a0a16; --bg2:#141428; --gold:#dfb25c; --gold-light:#f5d696;
    --panel:#12121f; --panel-line:rgba(255,255,255,.08); --text:#e9e6f0; --muted:#a9a5b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(ellipse at 50% -10%, #1c1c3a 0%, var(--bg1) 60%);
    color:var(--text);
  }
  header{
    text-align:center; padding:26px 16px 14px; border-bottom:1px solid var(--panel-line);
  }
  header h1{
    margin:0; font-size:1.35rem; letter-spacing:.5px; color:var(--gold-light);
    text-shadow:0 0 18px rgba(223,178,92,.35);
  }
  header p{margin:8px 0 0; color:var(--muted); font-size:.85rem;}

  .wrap{max-width:900px; margin:0 auto; padding:18px 14px 60px;}

  .grid{
    display:grid; grid-template-columns:repeat(5, 1fr); gap:10px;
  }
  .tier-break{
    grid-column:1 / -1; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:6px 0; opacity:.5;
  }
  .badge-cell{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6px 2px 8px; cursor:pointer; transition:transform .15s, border-color .15s;
  }
  .badge-cell:active{transform:scale(.95);}
  .badge-cell:hover{border-color:var(--gold);}
  .badge-cell svg{width:100%; max-width:64px; aspect-ratio:1/1;}
  .badge-cell .lvl-num{font-size:.68rem; color:var(--muted); margin-top:2px; font-weight:600;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,4,10,.82); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    width:100%; max-width:420px; background:linear-gradient(180deg,#171728,#0f0f1c);
    border:1px solid var(--gold); border-radius:16px; padding:22px 20px 24px; position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    max-height:88vh; overflow-y:auto;
    transition:box-shadow .25s ease;
  }
  .modal-nav-row{
    display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:6px;
  }
  .nav-arrow{
    background:rgba(223,178,92,.08); border:1px solid rgba(223,178,92,.4); color:var(--gold-light);
    width:38px; height:38px; border-radius:50%; font-size:1.4rem; line-height:1; cursor:pointer;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:background .15s, transform .1s;
  }
  .nav-arrow:active{transform:scale(.92);}
  .nav-arrow:disabled{opacity:.25; cursor:default;}
  .nav-arrow:not(:disabled):hover{background:rgba(223,178,92,.18);}
  .modal-close{
    position:absolute; top:10px; right:12px; background:none; border:none; color:var(--muted);
    font-size:1.4rem; cursor:pointer; line-height:1;
  }
  .modal-badge{width:120px; margin:0 auto 10px; display:block;}
  .modal-card h2{margin:0 0 2px; text-align:center; color:var(--gold-light); font-size:1.15rem;}
  .modal-level-tag{
    text-align:center; color:var(--muted); font-size:.8rem; margin-bottom:14px; letter-spacing:.5px;
  }
  .stat-row{
    display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--panel-line);
    font-size:.88rem;
  }
  .stat-row .k{color:var(--muted);}
  .stat-row .v{font-weight:700; color:var(--text);}
  .motiv-line{
    text-align:center; font-size:1.05rem; font-weight:700; color:var(--gold-light); margin:16px 0 10px;
    text-shadow:0 0 12px rgba(223,178,92,.25);
  }
  .importance{
    font-size:.85rem; color:var(--muted); line-height:1.5; margin-top:6px;
  }
  .placeholder-note{
    font-size:.7rem; color:#8d7a4a; margin-top:14px; border-top:1px dashed var(--panel-line); padding-top:10px;
  }
  .meaning-tag{
    text-align:center; font-size:.72rem; letter-spacing:1.5px; text-transform:uppercase;
    color:#8f8aa8; margin-top:-6px; margin-bottom:10px;
  }

  /* ---------- per-tier animations (portable: pure CSS, no JS timers) ---------- */
  /* Tier 0 (1-10): breathing */
  @keyframes anim-breathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .t-breathe{ animation:anim-breathe 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

  /* Tier 1 (11-20): steady rotation, once every 2s */
  @keyframes anim-rotate-cw{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .t-rotate-cw{ animation:anim-rotate-cw 2s linear infinite; transform-box:fill-box; transform-origin:center; }

  /* Tier 2 (21-30): pulsing glow */
  @keyframes anim-pulse-glow{ 0%,100%{filter:drop-shadow(0 0 2px currentColor) brightness(1);} 50%{filter:drop-shadow(0 0 7px currentColor) brightness(1.3);} }
  .t-pulse-glow{ animation:anim-pulse-glow 2.6s ease-in-out infinite; }

  /* Tier 3 (31-40): shimmer sweep — handled via SMIL inside the SVG itself */

  /* Tier 4 (41-49): sway, like a pendulum */
  @keyframes anim-sway{ 0%,100%{transform:rotate(-9deg);} 50%{transform:rotate(9deg);} }
  .t-sway{ animation:anim-sway 2.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

  /* Tier 5 (50-59): twinkle — Diamond Dawn */
  @keyframes anim-twinkle{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.6);} }
  .t-twinkle{ animation:anim-twinkle 1.4s ease-in-out infinite; }

  /* Tier 6 (60-69): counter-rotation, opposite direction/speed to tier 1 */
  @keyframes anim-rotate-ccw{ from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }
  .t-rotate-ccw{ animation:anim-rotate-ccw 3.4s linear infinite; transform-box:fill-box; transform-origin:center; }

  /* Tier 7 (70-79): ember pulse — glow + scale together */
  @keyframes anim-ember{ 0%,100%{filter:drop-shadow(0 0 3px #d43a3a) brightness(1); transform:scale(1);} 50%{filter:drop-shadow(0 0 11px #ff6b6b) brightness(1.2); transform:scale(1.05);} }
  .t-ember{ animation:anim-ember 2.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

  /* Tier 8 (80-89): slow rotation (paired with SMIL shimmer) */
  .t-rotate-slow{ animation:anim-rotate-cw 8s linear infinite; transform-box:fill-box; transform-origin:center; }

  /* Tier 9 (90-99): heartbeat double-pulse */
  @keyframes anim-heartbeat{ 0%,100%{transform:scale(1);} 14%{transform:scale(1.12);} 28%{transform:scale(1);} 42%{transform:scale(1.08);} 65%{transform:scale(1);} }
  .t-heartbeat{ animation:anim-heartbeat 1.7s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

  /* Apex (Level 100): rotate + breathe (nested groups) + gold glow */
  @keyframes anim-glow-gold{ 0%,100%{filter:drop-shadow(0 0 4px #ffdd7a);} 50%{filter:drop-shadow(0 0 16px #ffe9a8);} }
  .t-glow-gold{ animation:anim-glow-gold 2.4s ease-in-out infinite; }
</style>

 {

  "name": "Absolute Sovereign / Grand Legend",
  "days": 3000,

  "colors": [

  "importance": "The Absolute Sovereign apex: ten concentric decagons in full color, gold-lit, diamond blazing \u2014 the highest rank the Multiverse recognizes.",

<script>
const LEVELS = JSON.parse(document.getElementById('levels-data').textContent);

/* =========================================================================
   RANK SYSTEM BEYOND LEVEL 100 — "PRESTIGE CYCLES" (baked in, not yet rendered)
   ---------------------------------------------------------------------------
   The 1-100 badge system (tiers, decagon colors, diamond milestone) is one
   full "cycle". Past level 100, the same 1-100 logic repeats indefinitely,
   but each cycle is told apart by drawing its recurring motif shape
   side-by-side, repeated once per cycle number:
     - Levels   1-100  = cycle 1 -> motif drawn once   (built above)
     - Levels 101-200  = cycle 2 -> motif drawn twice,  side by side
     - Levels 201-300  = cycle 3 -> motif drawn 3x,     side by side
     - Levels 301-400  = cycle 4 -> motif drawn 4x, and so on forever.
   The position-in-cycle still picks the shape/tier/decagon-count exactly as
   levels 1-100 do below — only the repeat-count of that shape changes.
   To extend the grid past 100, regenerate data for the desired level range
   using cycleInfo() below, then pass entry.repeat into buildBadgeSVG() to
   lay out that many copies of the motif side by side instead of one.
   ========================================================================= */
function cycleInfo(level) {
  const cycle = Math.floor((level - 1) / 100) + 1;      // 1, 2, 3, ...
  const positionInCycle = ((level - 1) % 100) + 1;       // 1..100, reuses all tier/shape rules above
  const repeat = cycle;                                   // how many copies of the motif to draw side by side
  return { cycle, positionInCycle, repeat };
}


// ---------- badge SVG generator ----------
function regularPolygonPoints(cx, cy, r, sides, rotationDeg = -90) {
  const pts = [];
  for (let i = 0; i < sides; i++) {
    const a = (rotationDeg + i * 360 / sides) * Math.PI / 180;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}
function ptsToStr(pts) { return pts.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' '); }

function shapeSides(shape) {
  return { triangle:3, square:4, pentagon:5, hexagon:6, heptagon:7, octagon:8, nonagon:9, decagon:10 }[shape] || 0;
}

// ---------- color helpers (for gradient sheens on the richer modal view) ----------
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
}
function shade(hex, pct) { // pct > 0 lightens toward white, < 0 darkens toward black
  const [r,g,b] = hexToRgb(hex);
  const t = pct > 0 ? 255 : 0;
  const p = Math.abs(pct);
  const mix = (c) => Math.round(c + (t - c) * p);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

// One entry per tier (0-10). Each maps to portable CSS classes only —
// no JS timers — so this whole block can be lifted into any site/app as-is.
const TIER_ANIM = {
  0:  { group: 't-breathe' },                                   // breathing
  1:  { group: 't-rotate-cw' },                                 // rotates every 2s
  2:  { filter: 't-pulse-glow' },                                // pulsing glow
  3:  { shimmer: true },                                        // shimmer sweep (SMIL)
  4:  { group: 't-sway' },                                      // pendulum sway
  5:  { filter: 't-twinkle' },                                  // twinkle
  6:  { group: 't-rotate-ccw' },                                // counter-rotation
  7:  { group: 't-ember' },                                     // ember pulse (glow+scale)
  8:  { group: 't-rotate-slow', shimmer: true },                // slow rotate + shimmer
  9:  { group: 't-heartbeat' },                                 // heartbeat double-pulse
  10: { group: 't-rotate-slow', innerGroup: 't-breathe', filter: 't-glow-gold' }, // apex combo
};

function buildShimmerOverlay(cx, cy, outerR, uid) {
  return `<clipPath id="clip-${uid}"><circle cx="${cx}" cy="${cy}" r="${outerR}"/></clipPath>
  <g clip-path="url(#clip-${uid})">
    <ellipse cx="${cx - outerR}" cy="${cy}" rx="7" ry="${outerR}" fill="#ffffff" opacity="0.22" transform="rotate(22 ${cx} ${cy})">
      <animate attributeName="cx" values="${cx-outerR-14};${cx+outerR+14}" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>`;
}

function buildBadgeSVG(entry, size, isModal) {
  const cx = 50, cy = 50;
  const outerR = 44;
  const uid = entry.level + (isModal ? '-m' : '-g');
  let inner = '';

  if (entry.goldApex) {
    inner += `<defs><radialGradient id="apexGlow-${uid}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6da" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff6da" stop-opacity="0"/>
    </radialGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="46" fill="url(#apexGlow-${uid})"/>`;
  }

  // glow filter used throughout the richer modal rendering
  if (isModal) {
    inner += `<defs><filter id="glow-${uid}" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>`;
  }

  // outer gold ring: double bezel + gem-dots in modal mode, single ring in grid
  if (isModal) {
    inner += `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="#dfb25c" stroke-width="2.4"/>`;
    inner += `<circle cx="${cx}" cy="${cy}" r="${outerR-3}" fill="none" stroke="#8a6a30" stroke-width="1"/>`;
    [0,90,180,270].forEach(a => {
      const rad = a * Math.PI / 180;
      const gx = cx + outerR * Math.cos(rad), gy = cy + outerR * Math.sin(rad);
      inner += `<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="2.1" fill="#fff3cf" stroke="#dfb25c" stroke-width="0.6"/>`;
    });
  } else {
    inner += `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="#dfb25c" stroke-width="2.6"/>`;
  }

  let r = outerR * 0.80;
  const shrink = 0.80;
  const n = entry.decagons;
  for (let k = 0; k < n; k++) {
    const w = Math.max(0.5, 2.3 - n * 0.14);
    const pts = regularPolygonPoints(cx, cy, r, 10);
    if (isModal) {
      const gid = `dgrad-${uid}-${k}`;
      inner += `<defs><linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${shade(entry.colors[k], 0.45)}"/>
        <stop offset="55%" stop-color="${entry.colors[k]}"/>
        <stop offset="100%" stop-color="${shade(entry.colors[k], -0.35)}"/>
      </linearGradient></defs>`;
      inner += `<polygon points="${ptsToStr(pts)}" fill="${entry.colors[k]}" fill-opacity="0.07" stroke="url(#${gid})" stroke-width="${(w+0.5).toFixed(2)}" filter="url(#glow-${uid})"/>`;
    } else {
      inner += `<polygon points="${ptsToStr(pts)}" fill="none" stroke="${entry.colors[k]}" stroke-width="${w.toFixed(2)}"/>`;
    }
    r *= shrink;
  }

  if (entry.shape) {
    const s = entry.shape;
    const color = n > 0 ? entry.colors[n - 1] : '#dfb25c';
    const sw = isModal ? 2.8 : 2.4;
    const filt = isModal ? ` filter="url(#glow-${uid})"` : '';
    const fillOpacity = isModal ? ' fill-opacity="0.12"' : ' fill="none"';
    if (s === 'circle') {
      inner += `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(2)}" ${isModal ? `fill="${color}"` : 'fill="none"'}${isModal?fillOpacity:''} stroke="${color}" stroke-width="${sw}"${filt}/>`;
    } else if (s === 'dissected-circle') {
      inner += `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(2)}" ${isModal ? `fill="${color}"` : 'fill="none"'}${isModal?fillOpacity:''} stroke="${color}" stroke-width="${sw}"${filt}/>`;
      inner += `<line x1="${(cx-r).toFixed(2)}" y1="${cy}" x2="${(cx+r).toFixed(2)}" y2="${cy}" stroke="${color}" stroke-width="${sw-0.2}"${filt}/>`;
    } else {
      const sides = shapeSides(s);
      const pts = regularPolygonPoints(cx, cy, r, sides);
      inner += `<polygon points="${ptsToStr(pts)}" ${isModal ? `fill="${color}"` : 'fill="none"'}${isModal?fillOpacity:''} stroke="${color}" stroke-width="${sw}"${filt}/>`;
    }
  }

  if (entry.diamond) {
    const dr = entry.goldApex ? 10 : 7.5;
    if (isModal) {
      // proper faceted diamond: 4 shaded facets + a sparkle highlight, instead of a flat kite
      const baseCol = entry.goldApex ? '#ffe9a8' : '#bfe9ff';
      const top = shade(baseCol, 0.35), left = shade(baseCol, 0.05), right = shade(baseCol, -0.15), bottom = shade(baseCol, -0.4);
      const glow = entry.goldApex ? '#ffdd7a' : '#8fd6ff';
      inner += `<g filter="url(#glow-${uid})">
        <polygon points="${cx},${cy-dr} ${cx+dr*0.72},${cy} ${cx},${cy} ${cx-dr*0.72},${cy}" fill="${top}"/>
        <polygon points="${cx-dr*0.72},${cy} ${cx},${cy} ${cx},${cy+dr} " fill="${left}"/>
        <polygon points="${cx},${cy} ${cx+dr*0.72},${cy} ${cx},${cy+dr}" fill="${right}"/>
        <polygon points="${cx},${cy-dr} ${cx+dr*0.72},${cy} ${cx},${cy+dr} ${cx-dr*0.72},${cy}" fill="none" stroke="${glow}" stroke-width="0.8"/>
        <path d="M${(cx-dr*0.3).toFixed(1)},${(cy-dr*0.35).toFixed(1)} l1.6,0 M${(cx-dr*0.05).toFixed(1)},${(cy-dr*0.55).toFixed(1)} l0,1.6" stroke="#ffffff" stroke-width="0.7" opacity="0.9"/>
      </g>`;
    } else {
      const dCol = entry.goldApex ? '#fff3cf' : '#bfe9ff';
      const glowCol = entry.goldApex ? '#ffdd7a' : '#8fd6ff';
      inner += `<polygon points="${cx},${cy-dr} ${cx+dr*0.72},${cy} ${cx},${cy+dr} ${cx-dr*0.72},${cy}"
               fill="${dCol}" stroke="${glowCol}" stroke-width="1" opacity="0.95"/>`;
    }
  }

  // ---- per-tier animation wrapping (nested <g> so transform-based effects never conflict) ----
  const ta = TIER_ANIM[entry.tier];
  let content = inner;
  if (ta.innerGroup) content = `<g class="${ta.innerGroup}">${content}</g>`;
  const groupClasses = [];
  if (ta.group) groupClasses.push(ta.group);
  if (ta.filter) groupClasses.push(ta.filter);
  if (groupClasses.length) content = `<g class="${groupClasses.join(' ')}">${content}</g>`;
  if (ta.shimmer) content += buildShimmerOverlay(cx, cy, outerR, uid);

  // ---- modal-only ornamentation: colored glow backdrop + ornamental tick ring ----
  let pre = '', post = '';
  if (isModal) {
    const glowColor = n > 0 ? entry.colors[n - 1] : '#dfb25c';
    pre = `<defs><radialGradient id="bg-${uid}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${glowColor}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${glowColor}" stop-opacity="0"/>
      </radialGradient></defs>
      <circle cx="${cx}" cy="${cy}" r="49" fill="url(#bg-${uid})"/>`;
    const ticks = [];
    for (let i = 0; i < 12; i++) {
      const a = i * 30 * Math.PI / 180;
      const x1 = cx + 46 * Math.cos(a), y1 = cy + 46 * Math.sin(a);
      const x2 = cx + 49 * Math.cos(a), y2 = cy + 49 * Math.sin(a);
      ticks.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#dfb25c" stroke-width="1" opacity="0.7"/>`);
    }
    post = ticks.join('');
  }

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">${pre}${content}${post}</svg>`;
}

// ---------- render grid ----------
const grid = document.getElementById('grid');
LEVELS.forEach((entry, i) => {
  if (i > 0 && i % 10 === 0) {
    const brk = document.createElement('div');
    brk.className = 'tier-break';
    grid.appendChild(brk);
  }
  const cell = document.createElement('div');
  cell.className = 'badge-cell';
  cell.innerHTML = buildBadgeSVG(entry, 64, false) + `<div class="lvl-num">#${entry.level}</div>`;
  cell.addEventListener('click', () => openModal(i));
  grid.appendChild(cell);
});

// ---------- modal ----------
const overlay = document.getElementById('modalOverlay');
const modalCard = document.getElementById('modalCard');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
let currentIndex = 0;

function tierGlowColor(entry) {
  return entry.decagons > 0 ? entry.colors[entry.decagons - 1] : '#dfb25c';
}

function openModal(index) {
  index = Math.max(0, Math.min(LEVELS.length - 1, index));
  currentIndex = index;
  const entry = LEVELS[index];

  document.getElementById('modalBadgeWrap').innerHTML = buildBadgeSVG(entry, 120, true);
  document.getElementById('modalBadgeWrap').firstChild && (document.getElementById('modalBadgeWrap').firstChild.className = 'modal-badge');
  document.getElementById('modalName').textContent = entry.name;
  document.getElementById('modalMeaning').textContent = entry.meaning;
  document.getElementById('modalTag').textContent = `LEVEL ${entry.level} OF 100`;
  document.getElementById('modalDays').textContent = entry.days + ' days';
  document.getElementById('modalExpect').textContent = entry.expectationPointsLabel + ' pts';
  document.getElementById('modalMotiv').textContent = entry.motivation;
  document.getElementById('modalImportance').textContent = entry.importance;

  const glow = tierGlowColor(entry);
  modalCard.style.boxShadow = `0 20px 60px rgba(0,0,0,.6), 0 0 30px ${glow}55`;

  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === LEVELS.length - 1;

  overlay.classList.add('open');
}

function closeModal() { overlay.classList.remove('open'); }

document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
prevBtn.addEventListener('click', () => openModal(currentIndex - 1));
nextBtn.addEventListener('click', () => openModal(currentIndex + 1));

document.addEventListener('keydown', (e) => {
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') openModal(currentIndex - 1);
  if (e.key === 'ArrowRight') openModal(currentIndex + 1);
  if (e.key === 'Escape') closeModal();
});

// swipe left/right on the card to move between ranks
let touchStartX = null;
modalCard.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive:true});
modalCard.addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 45) {
    if (dx > 0) openModal(currentIndex - 1); else openModal(currentIndex + 1);
  }
  touchStartX = null;
}, {passive:true});

</script>
<script>addEventListener("message",function(e){if(e.data&&e.data.wmsRank&&typeof openModal=="function"){openModal(Math.min(LEVELS.length,e.data.wmsRank)-1)}})</script></body>
